name: ChatGPT Plan Reviewer Regression

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/chatgpt_plan_reviewer.yml"
      - ".github/workflows/chatgpt_plan_reviewer_regression.yml"
      - "scripts/chatgpt_plan_reviewer_bridge__created_by_worker_gemini_cli__model_*.py"
      - "tests/test_chatgpt_plan_reviewer_bridge__created_by_worker_gemini_cli__model_*.py"
      - "reviewer/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/chatgpt_plan_reviewer.yml"
      - ".github/workflows/chatgpt_plan_reviewer_regression.yml"
      - "scripts/chatgpt_plan_reviewer_bridge__created_by_worker_gemini_cli__model_*.py"
      - "tests/test_chatgpt_plan_reviewer_bridge__created_by_worker_gemini_cli__model_*.py"
      - "reviewer/**"

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run TASK-0003 deterministic tests
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT="scripts/chatgpt_plan_reviewer_bridge__created_by_worker_gemini_cli__model_gemini-3.5-flash-lite__task_TASK-0003.py"
          TEST="tests/test_chatgpt_plan_reviewer_bridge__created_by_worker_gemini_cli__model_gemini-3.5-flash-lite__task_TASK-0003.py"
          WORKFLOW=".github/workflows/chatgpt_plan_reviewer.yml"

          test -f "$SCRIPT"
          test -f "$TEST"
          test -f "$WORKFLOW"

          python -m py_compile "$SCRIPT" "$TEST"
          python "$TEST"

          grep -q 'self-hosted' "$WORKFLOW"
          grep -q 'if: false' "$WORKFLOW"
          grep -q 'ZERO_SPEND_PLAN' "$SCRIPT"
          grep -q 'BLOCKED_NO_ASTRA' "$SCRIPT"
          grep -q 'BLOCKED_AUTH_REQUIRED' "$SCRIPT"
          grep -q 'BLOCKED_PLAN_ALLOWANCE' "$SCRIPT"
          grep -q 'merge_allowed.*False' "$SCRIPT"
