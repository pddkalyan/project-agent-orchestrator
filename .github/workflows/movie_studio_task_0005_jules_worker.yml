name: Movie Studio Jules Worker

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - "tasks/dispatch/task_0005_free_worker_trigger.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: task-0005-jules-dispatch
  cancel-in-progress: false

jobs:
  jules_worker:
    name: "PRIMARY WORKER · Jules"
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'feature/TASK-0005-movie-studio-core' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
      REPO_OWNER: pddkalyan
      REPO_NAME: project-agent-orchestrator
      STARTING_BRANCH: feature/TASK-0005-movie-studio-core
      CONTRACT_FILE: tasks/worker/task_0005_free_worker_contract.json
      TRIGGER_FILE: tasks/dispatch/task_0005_free_worker_trigger.json
    steps:
      - name: Checkout TASK-0005 control branch
        uses: actions/checkout@v4
        with:
          ref: feature/TASK-0005-movie-studio-core
          fetch-depth: 0

      - name: Validate Jules zero-incremental-spend contract
        shell: bash
        run: |
          set -euo pipefail
          test -n "${JULES_API_KEY:-}" || { echo "BLOCKED_JULES_API_KEY_MISSING" >&2; exit 76; }
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path("tasks/worker/task_0005_free_worker_contract.json").read_text(encoding="utf-8"))
          assert c["task_id"] == "TASK-0005"
          assert c["spend_limit_usd"] == 0
          assert c["provider_billing_allowed"] is False
          assert c["openai_routine_worker_allowed"] is False
          assert c["primary_worker_family"] == "Google Jules coding agent"
          assert "merge or auto-merge" in c["forbidden"]
          print("Jules worker contract verified.")
          PY

      - name: Create and monitor Jules coding session
        id: jules
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, sys, time, urllib.request, urllib.error
          from pathlib import Path

          API="https://jules.googleapis.com/v1alpha"
          KEY=os.environ["JULES_API_KEY"]
          OWNER=os.environ["REPO_OWNER"]
          REPO=os.environ["REPO_NAME"]
          BRANCH=os.environ["STARTING_BRANCH"]
          trigger=json.loads(Path(os.environ["TRIGGER_FILE"]).read_text(encoding="utf-8"))
          resume_sid=str(trigger.get("resume_jules_session_id") or "").strip()
          resume_prompt=str(trigger.get("resume_prompt") or "").strip()
          fresh_prompt=str(trigger.get("fresh_jules_prompt") or "").strip()
          fresh_title=str(trigger.get("fresh_jules_title") or "TASK-0005 Movie Studio verified implementation increment").strip()
          headers={"X-Goog-Api-Key":KEY,"Content-Type":"application/json"}

          def request(method, url, body=None):
              data=None if body is None else json.dumps(body).encode()
              req=urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      raw=r.read()
                      return {} if not raw else json.loads(raw)
              except urllib.error.HTTPError as e:
                  detail=e.read().decode("utf-8","replace")
                  raise SystemExit(f"JULES_API_HTTP_{e.code}: {detail[:1200]}")

          sources=request("GET", f"{API}/sources?pageSize=100").get("sources",[])
          source=None
          for s in sources:
              gh=s.get("githubRepo") or {}
              if gh.get("owner")==OWNER and gh.get("repo")==REPO:
                  source=s
                  break
          if not source:
              raise SystemExit("BLOCKED_JULES_SOURCE_NOT_CONNECTED")

          branch_names={b.get("displayName") for b in (source.get("githubRepo") or {}).get("branches",[])}
          if branch_names and BRANCH not in branch_names:
              raise SystemExit(f"BLOCKED_JULES_BRANCH_NOT_VISIBLE: {BRANCH}")

          contract=json.loads(Path("tasks/worker/task_0005_free_worker_contract.json").read_text(encoding="utf-8"))
          recovery_allowed = [
              "scripts/movie_studio_core__created_by_chatgpt__model_gpt_5_6_sol__task_TASK_0005.py",
              "tests/test_movie_studio_core__created_by_chatgpt__model_gpt_5_6_sol__task_TASK_0005.py",
              "schemas/movie_studio_production_state__created_by_chatgpt__model_gpt-5.6-sol__task_TASK-0005.schema.json",
          ]
          allowed="\n".join(f"- {p}" for p in recovery_allowed)
          prompt = "\n".join([
              "You are the PRIMARY CODING AGENT for TASK-0005 Movie Studio.",
              "",
              "This is a NARROW RECOVERY INCREMENT. Do not attempt the whole roadmap.",
              "Implement ONLY clean episode -> scene -> shot referential integrity in the durable production state.",
              "",
              "Required behavior:",
              "- Add a Scene state type and a scenes mapping on ProductionLedger.",
              "- Bind each persisted shot to a scene_id without corrupting the existing Shot constructor/API unnecessarily.",
              "- add_scene must reject blank and duplicate scene IDs.",
              "- add_shot must reject a non-empty scene_id that references an unknown scene; choose a migration-safe rule for existing unassigned shots and test it explicitly.",
              "- Checkpoint to_dict/from_dict must round-trip episode_id, scenes and shot scene_id consistently.",
              "- _from_dict root_fields MUST include every newly serialized root field, including scenes.",
              "- validate() must reject corrupted scene-map keys and dangling scene references.",
              "- Update the JSON schema to match the exact persisted representation.",
              "- Add focused deterministic positive/negative tests. Do not rewrite the existing test suite wholesale.",
              "",
              "Important lessons from the failed Jules session:",
              "- Do NOT create helper scripts such as fix_all_tests.py, patch_*.py, plan*.md, reqs_analysis.md or any temporary repository files.",
              "- Do NOT introduce test wrappers/hacks such as _Shot or mass regex rewrites.",
              "- Do NOT modify MovieBible, provider reconciliation, timeline, Google Drive, workflows, dispatch files, memory, monitor state, docs, reviews or provenance in this increment.",
              "- Preserve all existing zero-spend, idempotency, generation and QA behavior.",
              "- Run the existing deterministic test suite and your new tests; repair your own changes until green.",
              "- Do not ask for confirmation on ordinary implementation choices. Choose the smallest safe reversible design and continue.",
              "",
              "You may modify ONLY these three files:",
              allowed,
              "",
              "Incremental spend must remain USD 0.00. Do not use paid APIs, provider billing, private assets or local video inference.",
              "Create a focused pull request against feature/TASK-0005-movie-studio-core only after the increment is coherent. Never merge it yourself.",
          ])

          if resume_sid:
              sid=resume_sid
              if not resume_prompt:
                  raise SystemExit("JULES_RESUME_PROMPT_MISSING")
              prior=request("GET", f"{API}/sessions/{sid}")
              print(f"Resuming Jules session: {prior.get('url') or ('https://jules.google.com/session/'+sid)}")
              request("POST", f"{API}/sessions/{sid}:sendMessage", {"prompt": resume_prompt})
              time.sleep(8)
              session=request("GET", f"{API}/sessions/{sid}")
          else:
              payload={
                  "prompt": fresh_prompt or prompt,
                  "title": fresh_title,
                  "sourceContext":{
                      "source":source["name"],
                      "githubRepoContext":{"startingBranch":BRANCH}
                  },
                  "requirePlanApproval":False,
                  "automationMode":"AUTO_CREATE_PR"
              }
              session=request("POST", f"{API}/sessions", payload)
              sid=session.get("id") or (session.get("name","").split("/")[-1])
              if not sid:
                  raise SystemExit("JULES_SESSION_CREATE_RETURNED_NO_ID")

          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as fh:
              fh.write(f"session_id={sid}\n")
              fh.write(f"session_url={session.get('url') or ('https://jules.google.com/session/'+sid)}\n")

          Path("jules-session.json").write_text(json.dumps({
              "id":sid,
              "name":session.get("name"),
              "url":session.get("url"),
              "state":session.get("state"),
              "source":source.get("name"),
              "startingBranch":BRANCH
          },indent=2)+"\n",encoding="utf-8")

          print(f"Jules session: {session.get('url','(URL pending)')}")
          terminal={"COMPLETED","FAILED"}
          last=None
          feedback_rounds=0
          max_feedback_rounds=8
          last_feedback_message=None
          repeated_feedback_count=0
          failure_recovery_rounds=0
          max_failure_recovery_rounds=2
          resume_waiting_for_reactivation=bool(resume_sid)
          resume_started=time.time()
          deadline=time.time()+55*60

          while time.time()<deadline:
              current=request("GET", f"{API}/sessions/{sid}")
              state=current.get("state","STATE_UNSPECIFIED")
              if state != last:
                  print(f"Jules state: {state}")
                  last=state
              if resume_waiting_for_reactivation:
                  if state not in {"COMPLETED","FAILED"}:
                      resume_waiting_for_reactivation=False
                  elif time.time()-resume_started < 90:
                      time.sleep(5)
                      continue
                  else:
                      raise SystemExit("JULES_RESUME_DID_NOT_REACTIVATE")
              Path("jules-session.json").write_text(json.dumps({
                  "id":sid,
                  "name":current.get("name"),
                  "url":current.get("url"),
                  "state":state,
                  "outputs":current.get("outputs",[]),
                  "source":source.get("name"),
                  "startingBranch":BRANCH
              },indent=2)+"\n",encoding="utf-8")
              if state in terminal:
                  if state=="FAILED":
                      acts=request("GET", f"{API}/sessions/{sid}/activities?pageSize=100").get("activities",[])
                      reasons=[a.get("sessionFailed",{}).get("reason") for a in acts if a.get("sessionFailed")]
                      reason_text=(" | ".join(x for x in reasons if x) or "no reason supplied")
                      failure_recovery_rounds += 1
                      Path("jules-session-activities.json").write_text(
                          json.dumps({
                              "session_id":sid,
                              "failure_recovery_round":failure_recovery_rounds,
                              "reason":reason_text,
                              "activities":acts
                          },indent=2)+"\n",
                          encoding="utf-8"
                      )
                      low=reason_text.lower()
                      hard_blocker=any(token in low for token in (
                          "quota","rate limit","billing","payment","permission",
                          "unauthorized","forbidden","credential","authentication"
                      ))
                      if hard_blocker:
                          raise SystemExit("JULES_EXTERNAL_BLOCKER: "+reason_text)
                      if failure_recovery_rounds > max_failure_recovery_rounds:
                          raise SystemExit("JULES_FAILURE_RECOVERY_EXHAUSTED: "+reason_text)
                      recovery_prompt="\n".join([
                          "Recover from your failed TASK-0005 attempt and continue autonomously.",
                          f"Observed Jules failure: {reason_text}",
                          "Inspect your own previous work and failure context. Preserve correct work, remove scratch/helper/junk files, and fix the actual root cause.",
                          "Stay strictly inside the allowed files and current narrow task scope.",
                          "Run the full deterministic Movie Studio tests before finishing.",
                          "Do not weaken tests, spend money, enable billing, use local video inference, expose secrets, or merge anything.",
                          "If an ordinary implementation choice is needed, choose the smallest safe reversible option and continue without asking the user."
                      ])
                      print(f"Attempting bounded Jules failure recovery {failure_recovery_rounds}/{max_failure_recovery_rounds}: {reason_text[:800]}")
                      request("POST", f"{API}/sessions/{sid}:sendMessage", {"prompt":recovery_prompt})
                      resume_waiting_for_reactivation=True
                      resume_started=time.time()
                      time.sleep(8)
                      continue
                  prs=[]
                  for out in current.get("outputs",[]):
                      pr=(out or {}).get("pullRequest") or {}
                      if pr.get("url"):
                          prs.append(pr["url"])
                  with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as fh:
                      fh.write(f"session_id={sid}\n")
                      fh.write(f"session_url={current.get('url','')}\n")
                      fh.write(f"pr_url={(prs[-1] if prs else '')}\n")
                  if not prs:
                      print("Jules completed without creating a PR.")
                  else:
                      print("Jules PR:", prs[-1])
                  sys.exit(0)
              if state=="AWAITING_PLAN_APPROVAL":
                  request("POST", f"{API}/sessions/{sid}:approvePlan", {})
                  print("Jules plan auto-approved by zero-spend supervisor policy.")
                  time.sleep(10)
                  continue
              if state=="AWAITING_USER_FEEDBACK":
                  acts=request("GET", f"{API}/sessions/{sid}/activities?pageSize=100").get("activities",[])
                  Path("jules-session-activities.json").write_text(
                      json.dumps({"session_id":sid,"feedback_round":feedback_rounds,"activities":acts},indent=2)+"\n",
                      encoding="utf-8"
                  )
                  latest=""
                  for activity in reversed(acts):
                      msg=(activity.get("agentMessaged") or {}).get("agentMessage")
                      if msg:
                          latest=msg
                          break
                  if latest == last_feedback_message:
                      repeated_feedback_count += 1
                      print(f"Jules repeated identical feedback {repeated_feedback_count}/8; waiting before retry: {latest[:400]}")
                      if repeated_feedback_count >= 8:
                          raise SystemExit("JULES_STUCK_IDENTICAL_FEEDBACK: supervisor intervention needed; no paid fallback")
                      time.sleep(90)
                      continue
                  last_feedback_message=latest
                  repeated_feedback_count=0
                  feedback_rounds += 1
                  print(f"Jules requested distinct feedback round {feedback_rounds}: {latest[:800]}")
                  if feedback_rounds > max_feedback_rounds:
                      raise SystemExit("JULES_FEEDBACK_LOOP_EXHAUSTED")
                  reply = "\n".join([
                      "Proceed autonomously using your best safe engineering judgment within the existing TASK-0005 contract.",
                      "Do not wait for user confirmation for ordinary coding decisions.",
                      "Prefer the smallest reversible implementation that preserves existing tests and architecture.",
                      "Do not spend money, enable billing, expose secrets, use private assets, merge PRs, or change files outside the allowlist.",
                      "If your question concerns an implementation choice, choose the safest reasonable option and continue.",
                      "Do not repeat a progress update as a feedback request. Make the code changes, run tests, fix failures, and create the focused candidate PR.",
                      "If it truly requires a secret, payment, private asset, or irreversible external action, stop and report that exact blocker.",
                      f"Your latest question/context was: {latest[:3000]}"
                  ])
                  request("POST", f"{API}/sessions/{sid}:sendMessage", {"prompt":reply})
                  print("Autonomous supervisor feedback sent to Jules.")
                  time.sleep(10)
                  continue
              time.sleep(30)

          raise SystemExit("JULES_SESSION_MONITOR_TIMEOUT")
          PY

      - name: Upload Jules session evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-0005-jules-session-${{ github.run_id }}
          path: |
            jules-session.json
            jules-session-activities.json
          if-no-files-found: warn
          retention-days: 14

      - name: Publish Jules worker summary
        if: always()
        shell: bash
        run: |
          {
            echo "## TASK-0005 Jules primary worker"
            echo
            echo "**Session:** ${{ steps.jules.outputs.session_url }}"
            echo "**Jules PR:** ${{ steps.jules.outputs.pr_url }}"
            echo "**Starting branch:** feature/TASK-0005-movie-studio-core"
            echo "**Spend guard:** USD 0 incremental / no paid API fallback"
            echo
            echo "Jules-created PRs are intentionally not auto-merged. Jules CI Fixer may repair CI failures on its own PR."
          } >> "$GITHUB_STEP_SUMMARY"
