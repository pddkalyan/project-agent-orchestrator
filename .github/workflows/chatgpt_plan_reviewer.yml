name: ChatGPT Plan Reviewer

on:
  workflow_run:
    workflows:
      - ChatGPT Plan Reviewer Regression
    types:
      - completed
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  review:
    runs-on: [self-hosted, windows, chatgpt-reviewer]
    if: false  # Disabled until a separately reviewed host-local authorization activation step.
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Offline bridge self-check
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python scripts/chatgpt_plan_reviewer_bridge__created_by_worker_gemini_cli__model_gemini-3.5-flash-lite__task_TASK-0003.py --self-check

      # Live authorization/model discovery/reviewer inference is intentionally
      # absent from TASK-0003. A later reviewed activation task may add it.
