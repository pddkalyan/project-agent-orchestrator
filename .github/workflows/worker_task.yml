name: Cloud Worker Task

on:
  push:
    paths:
      - "tasks/queue/*.json"

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Locate task
        id: task
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t TASK_FILES < <(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^tasks/queue/.*\.json$' || true)
          if [[ "${#TASK_FILES[@]}" -ne 1 ]]; then
            echo "Expected exactly one queue task in triggering commit, found ${#TASK_FILES[@]}" >&2
            exit 13
          fi
          TASK_FILE="${TASK_FILES[0]}"
          TASK_ID="$(jq -r '.task_id' "$TASK_FILE")"
          WORKER_MODEL="$(jq -r '.preferred_worker_model // "gemini-3.5-flash-lite"' "$TASK_FILE")"
          echo "task_file=$TASK_FILE" >> "$GITHUB_OUTPUT"
          echo "task_id=$TASK_ID" >> "$GITHUB_OUTPUT"
          echo "worker_model=$WORKER_MODEL" >> "$GITHUB_OUTPUT"

      - name: Create isolated worker branch
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="agent/gemini-${{ steps.task.outputs.task_id }}-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          echo "WORKER_BRANCH=$BRANCH" >> "$GITHUB_ENV"

      - name: Install Gemini CLI
        run: npm install --global @google/gemini-cli

      - name: Run free cloud worker
        shell: bash
        run: |
          set -euo pipefail
          TASK_FILE="${{ steps.task.outputs.task_file }}"
          gemini --skip-trust --model "${{ steps.task.outputs.worker_model }}" --approval-mode=auto_edit --output-format=json \
            --prompt "You are the free cloud worker for Project Agent Orchestrator running as model ${{ steps.task.outputs.worker_model }}. Use that exact model identifier in provenance metadata and provenance-bearing filenames. Read AGENTS.md and GEMINI.md first, then read $TASK_FILE and all project memory it references. Perform ONLY the task in that JSON. You may use read/list/edit file tools, but do not run shell commands, install software, access the user's PC, spend money, call paid services, or generate video locally. Modify ONLY paths explicitly listed in allowed_paths. Preserve the zero-spend rule, cloud-only video inference, Astra reviewer role, and audit-only cleanup rule. Before finishing, create/update the requested Astra review packet and provenance records. Do not claim Astra approval." \
            > "worker_result_${{ steps.task.outputs.task_id }}.json"

      - name: TASK-0001 deterministic preflight
        if: steps.task.outputs.task_id == 'TASK-0001'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $script = Get-ChildItem "scripts" -Filter "pc_cleanup_audit__created_by_worker_gemini_cli__model_gemini-3.5-flash-lite__task_TASK-0001.ps1" | Select-Object -First 1
          if (-not $script) { throw "TASK-0001 audit script missing" }
          $scriptPath = $script.FullName

          $packet = Get-Content "review_packets/astra_review_TASK-0001__created_by_worker_gemini_cli__model_gemini-3.5-flash-lite.json" -Raw | ConvertFrom-Json
          $state = Get-Content "memory/CURRENT_STATE.json" -Raw | ConvertFrom-Json
          $next = Get-Content "memory/NEXT_ACTIONS.json" -Raw | ConvertFrom-Json
          $scriptText = Get-Content $scriptPath -Raw

          if ($scriptText -notmatch 'FileMode\]::CreateNew') { throw "OutputPath must use atomic FileMode.CreateNew" }
          if ($scriptText -match 'ErrorAction\s+SilentlyContinue') { throw "Enumeration errors must not be suppressed" }
          if ($packet.review_status -ne "PENDING_ASTRA_REVIEW") { throw "Review packet must remain pending Astra review" }
          if ($state.spend_limit_usd -ne 0) { throw "Spend limit must remain zero" }

          $fixtureRoot = Join-Path $env:RUNNER_TEMP "task0001-preflight"
          if (Test-Path -LiteralPath $fixtureRoot) { Remove-Item -LiteralPath $fixtureRoot -Recurse -Force }
          New-Item -ItemType Directory -Path $fixtureRoot | Out-Null
          $cand = Join-Path $fixtureRoot "candidate"
          New-Item -ItemType Directory -Path $cand | Out-Null
          "x" | Set-Content -LiteralPath (Join-Path $cand "one.tmp")
          "y" | Set-Content -LiteralPath (Join-Path $cand "two.log")

          $default = (& $scriptPath -ActiveProjectRoot $PWD) | ConvertFrom-Json
          if ($default.agent_owned_candidate_roots -isnot [System.Array]) { throw "Zero roots must serialize as array" }

          $one = (& $scriptPath -ActiveProjectRoot $PWD -AgentOwnedCandidateRoots @($cand)) | ConvertFrom-Json
          if ($one.agent_owned_candidate_roots -isnot [System.Array] -or $one.agent_owned_candidate_roots.Count -ne 1) { throw "One root must serialize as one-element array" }

          $multi = (& $scriptPath -ActiveProjectRoot $PWD -AgentOwnedCandidateRoots @($cand,$cand)) | ConvertFrom-Json
          $abs = @($multi.items.absolute_path)
          if (($abs | Sort-Object -Unique).Count -ne $abs.Count) { throw "Duplicate roots emitted duplicate files" }

          $collision = Join-Path $fixtureRoot "protected.json"
          "ORIGINAL" | Set-Content -LiteralPath $collision
          $before = (Get-FileHash -LiteralPath $collision -Algorithm SHA256).Hash
          & pwsh -NoProfile -File $scriptPath -ActiveProjectRoot $PWD -OutputPath $collision *> $null
          if ($LASTEXITCODE -eq 0) { throw "Existing OutputPath appeared successful" }
          $after = (Get-FileHash -LiteralPath $collision -Algorithm SHA256).Hash
          if ($before -ne $after) { throw "Existing OutputPath was modified" }

          Write-Host "TASK-0001 deterministic preflight passed."

      - name: TASK-0002 autonomous controller deterministic preflight
        if: steps.task.outputs.task_id == 'TASK-0002'
        shell: bash
        run: |
          set -euo pipefail
          WORKFLOW=".github/workflows/autonomous_controller.yml"
          SCRIPT="scripts/autonomous_controller__created_by_worker_gemini_cli__model_gemini-3.5-flash-lite__task_TASK-0002.py"
          TEST="tests/test_autonomous_controller__created_by_worker_gemini_cli__model_gemini-3.5-flash-lite__task_TASK-0002.py"
          PACKET="review_packets/astra_review_TASK-0002__created_by_worker_gemini_cli__model_gemini-3.5-flash-lite.json"

          test -f "$WORKFLOW"
          test -f "$SCRIPT"
          test -f "$TEST"
          test -f "$PACKET"

          python "$TEST"

          grep -q 'workflow_run:' "$WORKFLOW"
          grep -q 'Cloud Worker Task' "$WORKFLOW"
          grep -q 'contents: write' "$WORKFLOW"
          grep -q 'pull-requests: write' "$WORKFLOW"

          if grep -Eiq 'gh[[:space:]]+pr[[:space:]]+merge|enable[_ -]?auto[_ -]?merge|merge[_ -]?pull[_ -]?request' "$WORKFLOW" "$SCRIPT"; then
            echo "TASK-0002 must never auto-merge pull requests." >&2
            exit 31
          fi

          python - <<'PY'
          import json
          from pathlib import Path
          packet = json.loads(Path("review_packets/astra_review_TASK-0002__created_by_worker_gemini_cli__model_gemini-3.5-flash-lite.json").read_text())
          state = json.loads(Path("memory/CURRENT_STATE.json").read_text())
          assert packet.get("review_status") == "PENDING_ASTRA_REVIEW"
          assert state.get("spend_limit_usd") == 0
          assert state.get("astra_role") == "reviewer"
          assert state.get("local_video_inference") is False
          PY

          echo "TASK-0002 deterministic preflight passed."

      - name: Stage failed candidate evidence
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p failed_worker_bundle
          cp "worker_result_${{ steps.task.outputs.task_id }}.json" failed_worker_bundle/ 2>/dev/null || true
          git status --porcelain -uall > failed_worker_bundle/git-status.txt || true
          git diff --binary > "failed_worker_bundle/worker_patch_${{ steps.task.outputs.task_id }}.patch" || true
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            if [[ -f "$path" ]]; then
              mkdir -p "failed_worker_bundle/$(dirname "$path")"
              cp "$path" "failed_worker_bundle/$path"
            fi
          done < <(git status --porcelain -uall | awk '{print $2}')

      - name: Upload failed candidate evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: "failed-worker-bundle-${{ steps.task.outputs.task_id }}"
          path: failed_worker_bundle/
          retention-days: 30
          include-hidden-files: true

      - name: Validate worker file boundaries
        shell: bash
        run: |
          set -euo pipefail
          TASK_FILE="${{ steps.task.outputs.task_file }}"
          mapfile -t ALLOWED < <(jq -r '.allowed_paths[]' "$TASK_FILE")
          mapfile -t CHANGED < <(git status --porcelain -uall | awk '{print $2}')
          : > changed-files.txt
          for file in "${CHANGED[@]}"; do
            if [[ "$file" == "$TASK_FILE" || "$file" == worker_result_*.json || "$file" == "changed-files.txt" ]]; then
              continue
            fi
            ok=0
            for allowed in "${ALLOWED[@]}"; do
              if [[ "$file" == "$allowed" ]]; then
                ok=1
                break
              fi
            done
            if [[ "$ok" -ne 1 ]]; then
              echo "Worker changed disallowed path: $file" >&2
              exit 23
            fi
            echo "$file" >> changed-files.txt
          done

      - name: Ensure task produced changes
        shell: bash
        run: |
          set -euo pipefail
          test -s changed-files.txt

      - name: Stage worker bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p worker_bundle
          cp "worker_result_${{ steps.task.outputs.task_id }}.json" worker_bundle/
          cp changed-files.txt worker_bundle/
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            mkdir -p "worker_bundle/$(dirname "$file")"
            cp "$file" "worker_bundle/$file"
          done < changed-files.txt
          git diff --binary > "worker_bundle/worker_patch_${{ steps.task.outputs.task_id }}.patch" || true

      - name: Upload worker bundle
        uses: actions/upload-artifact@v4
        with:
          name: "worker-bundle-${{ steps.task.outputs.task_id }}"
          path: worker_bundle/
          retention-days: 30
          include-hidden-files: true
