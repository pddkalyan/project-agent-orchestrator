name: Cloud Worker Task

on:
  push:
    paths:
      - "tasks/queue/*.json"

  repository_dispatch:
    types:
      - worker_task_retry

permissions:
  actions: read
  contents: write

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Checkout bound task revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.task_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Locate and verify immutable task binding
        id: task
        shell: bash
        run: |
          set -euo pipefail
          HELPER_REPO="scripts/autonomous_controller__created_by_worker_gemini_cli__model_gemini-3.5-flash-lite__task_TASK-0002.py"
          TRUSTED_HELPER="$RUNNER_TEMP/task0002-trusted-validator.py"
          TASK_SHA="$(git rev-parse HEAD)"
          git show "$TASK_SHA:$HELPER_REPO" > "$TRUSTED_HELPER"
          python -m py_compile "$TRUSTED_HELPER"
          DISPATCH_KEY=""
          SOURCE_WORKER_RUN_ID=""

          if [[ "$GITHUB_EVENT_NAME" == "repository_dispatch" ]]; then
            TASK_FILE="$(jq -r '.client_payload.task_file // empty' "$GITHUB_EVENT_PATH")"
            EXPECTED_SHA="$(jq -r '.client_payload.task_sha // empty' "$GITHUB_EVENT_PATH")"
            EXPECTED_ID="$(jq -r '.client_payload.task_id // empty' "$GITHUB_EVENT_PATH")"
            EXPECTED_ATTEMPT="$(jq -r '.client_payload.retry_attempt // empty' "$GITHUB_EVENT_PATH")"
            SOURCE_WORKER_RUN_ID="$(jq -r '.client_payload.source_worker_run_id // empty' "$GITHUB_EVENT_PATH")"
            DISPATCH_KEY="$(jq -r '.client_payload.dispatch_key // empty' "$GITHUB_EVENT_PATH")"

            [[ "$TASK_FILE" =~ ^tasks/queue/[A-Za-z0-9._-]+\.json$ ]] || { echo "Invalid dispatch task_file" >&2; exit 12; }
            [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid dispatch task_sha" >&2; exit 12; }
            [[ "$EXPECTED_ID" =~ ^TASK-[0-9]+$ ]] || { echo "Invalid dispatch task_id" >&2; exit 12; }
            [[ "$EXPECTED_ATTEMPT" =~ ^[0-9]+$ ]] || { echo "Invalid dispatch retry_attempt" >&2; exit 12; }
            [[ "$SOURCE_WORKER_RUN_ID" =~ ^[0-9]+$ ]] || { echo "Invalid dispatch source_worker_run_id" >&2; exit 12; }
            [[ "$DISPATCH_KEY" =~ ^[0-9a-f]{32}$ ]] || { echo "Invalid dispatch_key" >&2; exit 12; }
            [[ "$TASK_SHA" == "$EXPECTED_SHA" ]] || { echo "Checked-out SHA does not match immutable dispatch binding" >&2; exit 12; }
            test -f "$TASK_FILE"

            TASK_ID="$(jq -er '.task_id' "$TASK_FILE")"
            RETRY_ATTEMPT="$(jq -er '.retry_attempt // 0' "$TASK_FILE")"
            [[ "$TASK_ID" == "$EXPECTED_ID" && "$RETRY_ATTEMPT" == "$EXPECTED_ATTEMPT" ]] || { echo "Task identity/attempt binding mismatch" >&2; exit 12; }
            python "$TRUSTED_HELPER" verify-binding "$TASK_FILE" "$TASK_FILE" "$TASK_SHA" "$TASK_ID" "$RETRY_ATTEMPT" "$DISPATCH_KEY" "$SOURCE_WORKER_RUN_ID" >/dev/null
          else
            mapfile -t TASK_FILES < <(git diff-tree --no-commit-id --name-only -r "$TASK_SHA" | grep '^tasks/queue/.*\.json$' || true)
            if [[ "${#TASK_FILES[@]}" -ne 1 ]]; then
              echo "Expected exactly one queue task in triggering commit, found ${#TASK_FILES[@]}" >&2
              exit 13
            fi
            TASK_FILE="${TASK_FILES[0]}"
            TASK_ID="$(jq -er '.task_id' "$TASK_FILE")"
            RETRY_ATTEMPT="$(jq -er '.retry_attempt // 0' "$TASK_FILE")"
          fi

          WORKER_MODEL="$(jq -r '.preferred_worker_model // "gemini-3.5-flash-lite"' "$TASK_FILE")"
          echo "task_file=$TASK_FILE" >> "$GITHUB_OUTPUT"
          echo "task_id=$TASK_ID" >> "$GITHUB_OUTPUT"
          echo "worker_model=$WORKER_MODEL" >> "$GITHUB_OUTPUT"
          echo "task_sha=$TASK_SHA" >> "$GITHUB_OUTPUT"
          echo "retry_attempt=$RETRY_ATTEMPT" >> "$GITHUB_OUTPUT"
          echo "dispatch_key=$DISPATCH_KEY" >> "$GITHUB_OUTPUT"
          echo "source_worker_run_id=$SOURCE_WORKER_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Claim logical dispatched worker execution
        id: claim
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "repository_dispatch" ]]; then
            echo "execute=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          KEY="${{ steps.task.outputs.dispatch_key }}"
          TASK_SHA="${{ steps.task.outputs.task_sha }}"
          REF="refs/heads/worker-execution-receipts/$KEY"
          API_REF="heads/worker-execution-receipts/$KEY"

          if EXISTING="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/$API_REF" 2>/dev/null)"; then
            SHA="$(jq -r '.object.sha' <<<"$EXISTING")"
            [[ "$SHA" == "$TASK_SHA" ]] || { echo "Execution receipt points at unexpected SHA" >&2; exit 14; }
            echo "execute=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="$REF" -f sha="$TASK_SHA" >/dev/null 2>&1; then
            echo "execute=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          EXISTING="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/$API_REF")"
          SHA="$(jq -r '.object.sha' <<<"$EXISTING")"
          [[ "$SHA" == "$TASK_SHA" ]] || { echo "Concurrent execution receipt mismatch" >&2; exit 14; }
          echo "execute=false" >> "$GITHUB_OUTPUT"

      - name: Record immutable worker context
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg task_file "${{ steps.task.outputs.task_file }}" \
            --arg task_id "${{ steps.task.outputs.task_id }}" \
            --arg task_sha "${{ steps.task.outputs.task_sha }}" \
            --argjson retry_attempt "${{ steps.task.outputs.retry_attempt }}" \
            --arg event_name "$GITHUB_EVENT_NAME" \
            --arg dispatch_key "${{ steps.task.outputs.dispatch_key }}" \
            --arg source_worker_run_id "${{ steps.task.outputs.source_worker_run_id }}" \
            --argjson execute "${{ steps.claim.outputs.execute }}" \
            '{task_file:$task_file,task_id:$task_id,task_sha:$task_sha,retry_attempt:$retry_attempt,event_name:$event_name,dispatch_key:$dispatch_key,source_worker_run_id:$source_worker_run_id,execute:$execute}' \
            > "$RUNNER_TEMP/worker_context.json"

      - name: Upload immutable worker context
        uses: actions/upload-artifact@v4
        with:
          name: worker-context
          path: ${{ runner.temp }}/worker_context.json
          retention-days: 30

      - name: Create isolated worker branch
        if: steps.claim.outputs.execute == 'true'
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="agent/gemini-${{ steps.task.outputs.task_id }}-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          echo "WORKER_BRANCH=$BRANCH" >> "$GITHUB_ENV"

      - name: Install Gemini CLI
        if: steps.claim.outputs.execute == 'true'
        run: npm install --global @google/gemini-cli

      - name: Run free cloud worker
        if: steps.claim.outputs.execute == 'true'
        shell: bash
        run: |
          set -euo pipefail
          TASK_FILE="${{ steps.task.outputs.task_file }}"
          gemini --skip-trust --model "${{ steps.task.outputs.worker_model }}" --approval-mode=auto_edit --output-format=json \
            --prompt "You are the free cloud worker for Project Agent Orchestrator running as model ${{ steps.task.outputs.worker_model }}. Use that exact model identifier in provenance metadata and provenance-bearing filenames. Read AGENTS.md and GEMINI.md first, then read $TASK_FILE and all project memory it references. Perform ONLY the task in that JSON. You may use read/list/edit file tools, but do not run shell commands, install software, access the user's PC, spend money, call paid services, or generate video locally. Modify ONLY paths explicitly listed in allowed_paths. Preserve the zero-spend rule, cloud-only video inference, Astra reviewer role, and audit-only cleanup rule. Before finishing, create/update the requested Astra review packet and provenance records. Do not claim Astra approval." \
            > "worker_result_${{ steps.task.outputs.task_id }}.json"

      - name: TASK-0001 deterministic preflight
        if: steps.claim.outputs.execute == 'true' && steps.task.outputs.task_id == 'TASK-0001'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $script = Get-ChildItem "scripts" -Filter "pc_cleanup_audit__created_by_worker_gemini_cli__model_gemini-3.5-flash-lite__task_TASK-0001.ps1" | Select-Object -First 1
          if (-not $script) { throw "TASK-0001 audit script missing" }
          $scriptPath = $script.FullName

          $packet = Get-Content "review_packets/astra_review_TASK-0001__created_by_worker_gemini_cli__model_gemini-3.5-flash-lite.json" -Raw | ConvertFrom-Json
          $state = Get-Content "memory/CURRENT_STATE.json" -Raw | ConvertFrom-Json
          $next = Get-Content "memory/NEXT_ACTIONS.json" -Raw | ConvertFrom-Json
          $scriptText = Get-Content $scriptPath -Raw

          if ($scriptText -notmatch 'FileMode\]::CreateNew') { throw "OutputPath must use atomic FileMode.CreateNew" }
          if ($scriptText -match 'ErrorAction\s+SilentlyContinue') { throw "Enumeration errors must not be suppressed" }
          if ($packet.review_status -ne "PENDING_ASTRA_REVIEW") { throw "Review packet must remain pending Astra review" }
          if ($state.spend_limit_usd -ne 0) { throw "Spend limit must remain zero" }

          $fixtureRoot = Join-Path $env:RUNNER_TEMP "task0001-preflight"
          if (Test-Path -LiteralPath $fixtureRoot) { Remove-Item -LiteralPath $fixtureRoot -Recurse -Force }
          New-Item -ItemType Directory -Path $fixtureRoot | Out-Null
          $cand = Join-Path $fixtureRoot "candidate"
          New-Item -ItemType Directory -Path $cand | Out-Null
          "x" | Set-Content -LiteralPath (Join-Path $cand "one.tmp")
          "y" | Set-Content -LiteralPath (Join-Path $cand "two.log")

          $default = (& $scriptPath -ActiveProjectRoot $PWD) | ConvertFrom-Json
          if ($default.agent_owned_candidate_roots -isnot [System.Array]) { throw "Zero roots must serialize as array" }

          $one = (& $scriptPath -ActiveProjectRoot $PWD -AgentOwnedCandidateRoots @($cand)) | ConvertFrom-Json
          if ($one.agent_owned_candidate_roots -isnot [System.Array] -or $one.agent_owned_candidate_roots.Count -ne 1) { throw "One root must serialize as one-element array" }

          $multi = (& $scriptPath -ActiveProjectRoot $PWD -AgentOwnedCandidateRoots @($cand,$cand)) | ConvertFrom-Json
          $abs = @($multi.items.absolute_path)
          if (($abs | Sort-Object -Unique).Count -ne $abs.Count) { throw "Duplicate roots emitted duplicate files" }

          $collision = Join-Path $fixtureRoot "protected.json"
          "ORIGINAL" | Set-Content -LiteralPath $collision
          $before = (Get-FileHash -LiteralPath $collision -Algorithm SHA256).Hash
          & pwsh -NoProfile -File $scriptPath -ActiveProjectRoot $PWD -OutputPath $collision *> $null
          if ($LASTEXITCODE -eq 0) { throw "Existing OutputPath appeared successful" }
          $after = (Get-FileHash -LiteralPath $collision -Algorithm SHA256).Hash
          if ($before -ne $after) { throw "Existing OutputPath was modified" }

          Write-Host "TASK-0001 deterministic preflight passed."

      - name: TASK-0002 autonomous controller deterministic preflight
        if: steps.claim.outputs.execute == 'true' && steps.task.outputs.task_id == 'TASK-0002'
        shell: bash
        run: |
          set -euo pipefail
          WORKFLOW=".github/workflows/autonomous_controller.yml"
          SCRIPT="scripts/autonomous_controller__created_by_worker_gemini_cli__model_gemini-3.5-flash-lite__task_TASK-0002.py"
          TEST="tests/test_autonomous_controller__created_by_worker_gemini_cli__model_gemini-3.5-flash-lite__task_TASK-0002.py"
          PACKET="review_packets/astra_review_TASK-0002__created_by_worker_gemini_cli__model_gemini-3.5-flash-lite.json"

          test -f "$WORKFLOW"
          test -f "$SCRIPT"
          test -f "$TEST"
          test -f "$PACKET"

          python "$TEST"

          grep -q 'workflow_run:' "$WORKFLOW"
          grep -q 'Cloud Worker Task' "$WORKFLOW"
          grep -q 'contents: write' "$WORKFLOW"
          grep -q 'pull-requests: write' "$WORKFLOW"

          if grep -Eiq 'gh[[:space:]]+pr[[:space:]]+merge|enable[_ -]?auto[_ -]?merge|merge[_ -]?pull[_ -]?request' "$WORKFLOW" "$SCRIPT"; then
            echo "TASK-0002 must never auto-merge pull requests." >&2
            exit 31
          fi

          python - <<'PY'
          import json
          from pathlib import Path
          packet = json.loads(Path("review_packets/astra_review_TASK-0002__created_by_worker_gemini_cli__model_gemini-3.5-flash-lite.json").read_text())
          state = json.loads(Path("memory/CURRENT_STATE.json").read_text())
          assert packet.get("review_status") == "PENDING_ASTRA_REVIEW"
          assert state.get("spend_limit_usd") == 0
          assert state.get("astra_role") == "reviewer"
          assert state.get("local_video_inference") is False
          PY

          echo "TASK-0002 deterministic preflight passed."

      - name: Stage safe failed candidate evidence
        if: failure() && steps.claim.outputs.execute == 'true'
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/failed-worker-bundle-$GITHUB_RUN_ID"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          jq -n \
            --arg task_id "${{ steps.task.outputs.task_id }}" \
            --arg task_sha "${{ steps.task.outputs.task_sha }}" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg note "Worker pipeline failed; raw worker-controlled files are intentionally omitted from failure evidence." \
            '{task_id:$task_id,task_sha:$task_sha,worker_run_id:$run_id,note:$note}' \
            > "$OUT/failure-metadata.json"

      - name: Upload safe failed candidate evidence
        if: failure() && steps.claim.outputs.execute == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: "failed-worker-bundle-${{ steps.task.outputs.task_id }}"
          path: ${{ runner.temp }}/failed-worker-bundle-${{ github.run_id }}/
          retention-days: 30
          include-hidden-files: true

      - name: Validate worker file boundaries
        if: steps.claim.outputs.execute == 'true'
        shell: bash
        run: |
          set -euo pipefail
          TASK_FILE="${{ steps.task.outputs.task_file }}"
          mapfile -t ALLOWED < <(jq -r '.allowed_paths[]' "$TASK_FILE")
          mapfile -t CHANGED < <(git status --porcelain -uall | awk '{print $2}')
          : > changed-files.txt
          for file in "${CHANGED[@]}"; do
            if [[ "$file" == "$TASK_FILE" || "$file" == worker_result_*.json || "$file" == "changed-files.txt" || "$file" == "worker_context.json" ]]; then
              continue
            fi
            ok=0
            for allowed in "${ALLOWED[@]}"; do
              if [[ "$file" == "$allowed" ]]; then
                ok=1
                break
              fi
            done
            if [[ "$ok" -ne 1 ]]; then
              echo "Worker changed disallowed path: $file" >&2
              exit 23
            fi
            echo "$file" >> changed-files.txt
          done

          TRUSTED_HELPER="$RUNNER_TEMP/task0002-trusted-validator.py"
          test -f "$TRUSTED_HELPER"
          python "$TRUSTED_HELPER" validate-staging "$PWD" "changed-files.txt" "worker_result_${{ steps.task.outputs.task_id }}.json" >/dev/null

      - name: Ensure task produced changes
        if: steps.claim.outputs.execute == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -s changed-files.txt

      - name: Stage worker bundle with immutable validator
        if: steps.claim.outputs.execute == 'true'
        shell: bash
        run: |
          set -euo pipefail
          TRUSTED_HELPER="$RUNNER_TEMP/task0002-trusted-validator.py"
          BUNDLE="$RUNNER_TEMP/worker-bundle-$GITHUB_RUN_ID"
          rm -rf "$BUNDLE"
          python "$TRUSTED_HELPER" stage-bundle "$PWD" "changed-files.txt" "worker_result_${{ steps.task.outputs.task_id }}.json" "$BUNDLE" > "$RUNNER_TEMP/stage-result.json"
          jq -e '.valid == true' "$RUNNER_TEMP/stage-result.json" >/dev/null
          git diff --binary > "$BUNDLE/worker_patch_${{ steps.task.outputs.task_id }}.patch" || true

      - name: Upload worker bundle
        if: steps.claim.outputs.execute == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: "worker-bundle-${{ steps.task.outputs.task_id }}"
          path: ${{ runner.temp }}/worker-bundle-${{ github.run_id }}/
          retention-days: 30
          include-hidden-files: true
