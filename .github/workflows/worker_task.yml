name: Cloud Worker Task

on:
  push:
    paths:
      - "tasks/queue/*.json"

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Locate task
        id: task
        shell: bash
        run: |
          set -euo pipefail
          TASK_FILE="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^tasks/queue/.*\.json$' | head -n 1)"
          test -n "$TASK_FILE"
          TASK_ID="$(jq -r '.task_id' "$TASK_FILE")"
          WORKER_MODEL="$(jq -r '.preferred_worker_model // "gemini-3.5-flash-lite"' "$TASK_FILE")"
          echo "task_file=$TASK_FILE" >> "$GITHUB_OUTPUT"
          echo "task_id=$TASK_ID" >> "$GITHUB_OUTPUT"
          echo "worker_model=$WORKER_MODEL" >> "$GITHUB_OUTPUT"

      - name: Create isolated worker branch
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="agent/gemini-${{ steps.task.outputs.task_id }}-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          echo "WORKER_BRANCH=$BRANCH" >> "$GITHUB_ENV"

      - name: Install Gemini CLI
        run: npm install --global @google/gemini-cli

      - name: Run free cloud worker
        shell: bash
        run: |
          set -euo pipefail
          TASK_FILE="${{ steps.task.outputs.task_file }}"
          gemini --skip-trust --model "${{ steps.task.outputs.worker_model }}" --approval-mode=auto_edit --output-format=json             --prompt "You are the free cloud worker for Project Agent Orchestrator running as model ${{ steps.task.outputs.worker_model }}. Use that exact model identifier in provenance metadata and provenance-bearing filenames. Read AGENTS.md and GEMINI.md first, then read $TASK_FILE and all project memory it references. Perform ONLY the task in that JSON. You may use read/list/edit file tools, but do not run shell commands, install software, access the user's PC, spend money, call paid services, or generate video locally. Modify ONLY paths explicitly listed in allowed_paths. Preserve the zero-spend rule, cloud-only video inference, Astra reviewer role, and audit-only cleanup rule. Before finishing, create/update the requested Astra review packet and provenance records. Do not claim Astra approval."             > "worker_result_${{ steps.task.outputs.task_id }}.json"

      - name: TASK-0001 deterministic preflight
        if: steps.task.outputs.task_id == 'TASK-0001'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $script = Get-ChildItem "scripts" -Filter "pc_cleanup_audit__created_by_worker_gemini_cli__model_gemini-3.5-flash-lite__task_TASK-0001.ps1" | Select-Object -First 1
          if (-not $script) { throw "TASK-0001 audit script missing" }
          $scriptPath = $script.FullName

          $packet = Get-Content "review_packets/astra_review_TASK-0001__created_by_worker_gemini_cli__model_gemini-3.5-flash-lite.json" -Raw | ConvertFrom-Json
          $state = Get-Content "memory/CURRENT_STATE.json" -Raw | ConvertFrom-Json
          $next = Get-Content "memory/NEXT_ACTIONS.json" -Raw | ConvertFrom-Json
          $scriptText = Get-Content $scriptPath -Raw

          if ($scriptText -notmatch 'FileMode\]::CreateNew') { throw "OutputPath must use atomic FileMode.CreateNew" }
          if ($scriptText -match 'ErrorAction\s+SilentlyContinue') { throw "Enumeration errors must not be suppressed" }
          if ($scriptText -match 'CANDIDATE_FOR_AUDIT') { throw "Deprecated recommendation CANDIDATE_FOR_AUDIT is not allowed" }
          if ($scriptText -match 'Set-Content\s+-Path\s+\$OutputPath|WriteAllText\s*\(\s*\$OutputPath') { throw "OutputPath must not use overwriting write APIs" }

          if ($packet.review_status -ne "PENDING_ASTRA_REVIEW") { throw "Review packet must remain pending Astra review" }
          if ($packet.ci_evidence.status -ne "PENDING") { throw "CI evidence must be PENDING before PR CI" }
          if ($null -ne $packet.ci_evidence.run_id -or $null -ne $packet.ci_evidence.result) { throw "CI evidence must not fabricate run/result before PR CI" }

          if ($state.persistent_storage_provider -ne "Google Drive") { throw "CURRENT_STATE must record Google Drive" }
          if ($state.secrets.gemini_api_key -ne "CONFIGURED_VIA_REPOSITORY_SECRET") { throw "CURRENT_STATE must record configured Gemini repository secret" }
          if ($state.spend_limit_usd -ne 0) { throw "Spend limit must remain zero" }
          if (($next.next -join [Environment]::NewLine) -match 'User adds GEMINI_API_KEY|User confirms the provider for the 5 TB cloud storage') { throw "NEXT_ACTIONS still contains completed manual setup steps" }

          $fixtureRoot = Join-Path $env:RUNNER_TEMP "task0001-preflight"
          if (Test-Path -LiteralPath $fixtureRoot) { Remove-Item -LiteralPath $fixtureRoot -Recurse -Force }
          New-Item -ItemType Directory -Path $fixtureRoot | Out-Null
          $cand = Join-Path $fixtureRoot "candidate"
          New-Item -ItemType Directory -Path $cand | Out-Null
          "x" | Set-Content -LiteralPath (Join-Path $cand "one.tmp")
          "y" | Set-Content -LiteralPath (Join-Path $cand "two.log")

          $defaultJson = & $scriptPath -ActiveProjectRoot $PWD
          if ($LASTEXITCODE -ne 0) { throw "Default audit failed" }
          $default = $defaultJson | ConvertFrom-Json
          if ($default.agent_owned_candidate_roots -isnot [System.Array]) { throw "Zero candidate roots must serialize as array" }

          $oneJson = & $scriptPath -ActiveProjectRoot $PWD -AgentOwnedCandidateRoots @($cand)
          if ($LASTEXITCODE -ne 0) { throw "One-root audit failed" }
          $one = $oneJson | ConvertFrom-Json
          if ($one.agent_owned_candidate_roots -isnot [System.Array] -or $one.agent_owned_candidate_roots.Count -ne 1) { throw "One root must serialize as one-element array" }
          $external = @($one.items | Where-Object { $_.absolute_path -like "$cand*" })
          if ($external.Count -ne 2) { throw "Expected two external fixture files" }
          foreach ($item in $external) { if ($item.recommendation -ne "UNVERIFIED_DO_NOT_REMOVE") { throw "External unprovenanced candidate must be UNVERIFIED_DO_NOT_REMOVE" } }

          $multiJson = & $scriptPath -ActiveProjectRoot $PWD -AgentOwnedCandidateRoots @($cand,$cand)
          if ($LASTEXITCODE -ne 0) { throw "Duplicate-root audit failed" }
          $multi = $multiJson | ConvertFrom-Json
          $abs = @($multi.items.absolute_path)
          if (($abs | Sort-Object -Unique).Count -ne $abs.Count) { throw "Duplicate roots emitted duplicate files" }

          $workerResult = Join-Path $PWD "nested-preflight/worker_result_TASK-9999.json"
          New-Item -ItemType Directory -Path (Split-Path $workerResult -Parent) -Force | Out-Null
          "{}" | Set-Content -LiteralPath $workerResult
          try {
            $activeJson = & $scriptPath -ActiveProjectRoot $PWD -AgentOwnedCandidateRoots @($PWD)
            if ($LASTEXITCODE -ne 0) { throw "Active-overlap audit failed" }
            $active = $activeJson | ConvertFrom-Json
            foreach ($suffix in @(".gitignore", ".github/workflows/manual_worker_smoke.yml", "nested-preflight/worker_result_TASK-9999.json")) {
              $normSuffix = $suffix.Replace("/", [System.IO.Path]::DirectorySeparatorChar)
              $hit = @($active.items | Where-Object { $_.path -eq $normSuffix -or $_.absolute_path.EndsWith($normSuffix, [System.StringComparison]::OrdinalIgnoreCase) })
              if ($hit.Count -lt 1) { throw "Missing active fixture: $suffix" }
              if (@($hit | Where-Object { $_.recommendation -eq "KEEP_ACTIVE" }).Count -lt 1) { throw "$suffix was not KEEP_ACTIVE" }
            }
          } finally {
            Remove-Item -LiteralPath (Split-Path $workerResult -Parent) -Recurse -Force
          }

          $missing = Join-Path $fixtureRoot "missing"
          & pwsh -NoProfile -File $scriptPath -ActiveProjectRoot $PWD -AgentOwnedCandidateRoots $missing *> $null
          if ($LASTEXITCODE -eq 0) { throw "Missing candidate root appeared successful" }

          $collision = Join-Path $fixtureRoot "protected.json"
          "ORIGINAL" | Set-Content -LiteralPath $collision
          $before = (Get-FileHash -LiteralPath $collision -Algorithm SHA256).Hash
          & pwsh -NoProfile -File $scriptPath -ActiveProjectRoot $PWD -OutputPath $collision *> $null
          if ($LASTEXITCODE -eq 0) { throw "Existing OutputPath appeared successful" }
          $after = (Get-FileHash -LiteralPath $collision -Algorithm SHA256).Hash
          if ($before -ne $after) { throw "Existing OutputPath was modified" }

          $newReport = Join-Path $fixtureRoot "new-report.json"
          & pwsh -NoProfile -File $scriptPath -ActiveProjectRoot $PWD -OutputPath $newReport *> $null
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $newReport)) { throw "New OutputPath failed" }

          Write-Host "TASK-0001 deterministic preflight passed."
      - name: Validate worker file boundaries
        shell: bash
        run: |
          set -euo pipefail
          TASK_FILE="${{ steps.task.outputs.task_file }}"
          mapfile -t ALLOWED < <(jq -r '.allowed_paths[]' "$TASK_FILE")
          mapfile -t CHANGED < <(git status --porcelain -uall | awk '{print $2}')
          printf '%s\n' "${CHANGED[@]}" > changed-files.txt
          for file in "${CHANGED[@]}"; do
            if [[ "$file" == "$TASK_FILE" || "$file" == worker_result_*.json || "$file" == "changed-files.txt" ]]; then
              continue
            fi
            ok=0
            for allowed in "${ALLOWED[@]}"; do
              if [[ "$file" == "$allowed" ]]; then
                ok=1
                break
              fi
            done
            if [[ "$ok" -ne 1 ]]; then
              echo "Worker changed disallowed path: $file" >&2
              exit 23
            fi
          done

      - name: Ensure task produced changes
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(git status --porcelain | grep -v 'worker_result_' | grep -v 'changed-files.txt' || true)"

      - name: Stage worker bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p worker_bundle
          cp "worker_result_${{ steps.task.outputs.task_id }}.json" worker_bundle/
          cp changed-files.txt worker_bundle/
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            if [[ "$file" == worker_result_*.json || "$file" == "changed-files.txt" ]]; then
              continue
            fi
            mkdir -p "worker_bundle/$(dirname "$file")"
            cp "$file" "worker_bundle/$file"
          done < changed-files.txt
          git diff --binary > "worker_bundle/worker_patch_${{ steps.task.outputs.task_id }}.patch" || true

      - name: Upload worker bundle
        uses: actions/upload-artifact@v4
        with:
          name: "worker-bundle-${{ steps.task.outputs.task_id }}"
          path: worker_bundle/
          retention-days: 30
